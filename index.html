<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Documentos - 46º CONUBES</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .card-header {
            background-color: #0d6efd;
            color: white;
            font-weight: bold;
        }

        .section-title {
            border-bottom: 2px solid #dee2e6;
            padding-bottom: 5px;
            margin-bottom: 15px;
            margin-top: 20px;
            color: #495057;
        }
    </style>
</head>

<body>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow">
                    <div class="card-header text-center fs-4">
                        Gerador de Documentos - 46º CONUBES
                    </div>
                    <div class="card-body p-4">
                        <form id="docForm">

                            <h5 class="section-title">O que você deseja gerar?</h5>
                            <div class="mb-3 d-flex gap-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="chkAutorizacao" checked>
                                    <label class="form-check-label" for="chkAutorizacao">Autorização de Viagem</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="chkDeclaracao">
                                    <label class="form-check-label" for="chkDeclaracao">Declaração</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="chkAmbos">
                                    <label class="form-check-label fw-bold" for="chkAmbos">Gerar Ambos</label>
                                </div>
                            </div>

                            <h5 class="section-title">Dados do Viajante (Filho/a ou Membro)</h5>
                            <div class="row">
                                <div class="col-md-8 mb-3">
                                    <label class="form-label">Nome Completo</label>
                                    <input type="text" class="form-control" id="viajanteNome" required>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">CPF</label>
                                    <input type="text" class="form-control" id="viajanteCpf"
                                        placeholder="000.000.000-00" required>
                                </div>
                            </div>

                            <div id="secaoResponsavel">
                                <h5 class="section-title">Dados do Responsável</h5>
                                <div class="row">
                                    <div class="col-md-8 mb-3">
                                        <label class="form-label">Nome do Responsável</label>
                                        <input type="text" class="form-control" id="respNome">
                                    </div>
                                    <div class="col-md-4 mb-3">
                                        <label class="form-label">CPF do Responsável</label>
                                        <input type="text" class="form-control" id="respCpf"
                                            placeholder="000.000.000-00">
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-3 mb-3">
                                        <label class="form-label">CEP</label>
                                        <input type="text" class="form-control" id="respCep" placeholder="00000-000"
                                            maxlength="9">
                                    </div>
                                    <div class="col-md-7 mb-3">
                                        <label class="form-label">Rua</label>
                                        <input type="text" class="form-control" id="respRua">
                                    </div>
                                    <div class="col-md-2 mb-3">
                                        <label class="form-label">Número</label>
                                        <input type="text" class="form-control" id="respNum">
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-8 mb-3">
                                        <label class="form-label">Cidade</label>
                                        <input type="text" class="form-control" id="respCidade">
                                    </div>
                                    <div class="col-md-4 mb-3">
                                        <label class="form-label">Estado (UF)</label>
                                        <input type="text" class="form-control" id="respEstado" placeholder="Ex: SP"
                                            maxlength="2">
                                    </div>
                                </div>
                            </div>

                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn btn-primary btn-lg">Gerar Documento(s) e Baixar
                                    PDF</button>
                                <p class="text-center">Desenvolvido por: 
                                    <a href="https://steve.dev.br" target="_blank">Steve Thomas</a>
                                </p>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

        // INTEGRAÇÃO VIACEP
        respCep.addEventListener('blur', async (e) => {
            const cep = e.target.value.replace(/\D/g, '');

            if (cep.length === 8) {
                respRua.value = 'Buscando...';
                respCidade.value = 'Buscando...';
                respEstado.value = '...';

                try {
                    const response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                    const data = await response.json();

                    if (!data.erro) {
                        respRua.value = data.logradouro;
                        respCidade.value = data.localidade;
                        respEstado.value = data.uf;
                        respNum.focus();
                    } else {
                        alert("CEP não encontrado.");
                        limparCamposEndereco();
                    }
                } catch (error) {
                    alert("Erro ao buscar o CEP na base de dados.");
                    limparCamposEndereco();
                }
            }
        });

        function limparCamposEndereco() {
            respRua.value = '';
            respCidade.value = '';
            respEstado.value = '';

                docAuth.line(30, 160, 90, 160);
                docAuth.setFontSize(10);
                docAuth.text(respNome, 60, 165, { align: "center" });
                docAuth.text("Responsável Legal", 60, 170, { align: "center" });

                docAuth.line(120, 160, 180, 160);
                docAuth.text(NOME_PESSOA_AUTORIZADA, 150, 165, { align: "center" });
                docAuth.text("Pessoa Autorizada", 150, 170, { align: "center" });

                docAuth.setFontSize(8);
                docAuth.setTextColor(100);
                docAuth.text(carimboTempo, 105, 285, { align: "center" });

                docAuth.save(`Autorizacao_Viagem_${viajanteNome.replace(/\s+/g, '_')}.pdf`);
            }

            // GERAR DECLARAÇÃO
            if (chkDeclaracao.checked || chkAmbos.checked) {
                const docDecl = new jsPDF();

                docDecl.setFontSize(16);
                docDecl.setFont("helvetica", "bold");
                docDecl.text("DECLARAÇÃO", 105, 50, { align: "center" });

                docDecl.setFontSize(12);
                docDecl.setFont("helvetica", "normal");

                const textoDecl = `O Coletivo ParaTodos declara, para os devidos fins e a quem possa interessar, que ${viajanteNome}, portador(a) do CPF ${viajanteCpf}, irá viajar para participar do 46º CONUBES, evento que ocorrerá dos dias 16 a 19 de abril de 2026 na cidade de São Bernardo do Campo - SP.`;

                // TEXTO JUSTIFICADO AQUI
                docDecl.text(textoDecl, 20, 80, { maxWidth: 170, align: "justify" });

                docDecl.text(`Florianópolis, ${dataFormatada}.`, 20, 130);

                docDecl.line(60, 180, 150, 180);
                docDecl.setFontSize(10);
                docDecl.text("Representante", 105, 185, { align: "center" });
                docDecl.text("Coletivo ParaTodos", 105, 190, { align: "center" });

                docDecl.setFontSize(8);
                docDecl.setTextColor(100);
                docDecl.text(carimboTempo, 105, 285, { align: "center" });

                setTimeout(() => {
                    docDecl.save(`Declaracao_Conubes_${viajanteNome.replace(/\s+/g, '_')}.pdf`);
                }, chkAmbos.checked ? 500 : 0);
            }
        });

        // Inicializar visibilidade correta
        atualizarVisibilidade();
    </script>

</body>

</html>
